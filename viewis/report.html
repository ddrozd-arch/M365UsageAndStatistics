<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Power BI – Card with Loader</title>

<style>
    body {
        font-family: Segoe UI, Arial, sans-serif;
        background: #f5f5f5;
        padding: 40px;
    }

    .section-title {
        font-size: 26px;
        font-weight: 600;
        margin-bottom: 24px;
    }

    /* Card */
    .pbi-card {
        width: 100%;
        max-width: 1200px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        overflow: hidden;
        position: relative;
    }

    /* Loader overlay */
    .loader-overlay {
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        transition: opacity 0.4s ease;
    }

    .loader-overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }

    /* Fluent spinner */
    .spinner {
        width: 48px;
        height: 48px;
        border: 5px solid #e0e0e0;
        border-top-color: #0078d4;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Wrapper for responsive iframe */
    .pbi-wrapper {
        width: 100%;
        height: 80vh;
        overflow: hidden;
    }

    #pbiFrame {
        width: 100%;
        height: 100%;
        border: none;
    }
</style>
</head>

<body>

<div class="section-title">Raport Power BI</div>

<!-- CARD -->
<div class="pbi-card">

    <!-- LOADER -->
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <!-- REPORT -->
    <div class="pbi-wrapper">
        <iframe id="pbiFrame"></iframe>
    </div>
</div>

<script>
    // Adres raportu Power BI Report Server (on-prem)
    const reportUrl =
        "https://twoj-serwer/reports/powerbi/Folder/Raport?rs:Embed=true";

    const frame = document.getElementById("pbiFrame");
    const loader = document.getElementById("loader");

    // Ustaw URL raportu
    frame.src = reportUrl;

    // Ukryj loader, gdy iframe się załaduje
    frame.onload = () => {
        loader.classList.add("hidden");
    };

    // Dynamiczne dopasowanie wysokości
    function resizePbi() {
        frame.style.height = window.innerHeight * 0.80 + "px";
    }

    window.addEventListener("resize", resizePbi);
    resizePbi();
</script>

</body>
</html>
